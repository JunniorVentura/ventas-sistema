services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventas_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    depends_on:
      - db
    command: >
      bash -c "composer install &&
               php artisan migrate:fresh --seed &&
               php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:15
    container_name: ventas_db
    environment:
      POSTGRES_DB: ventas_empresa
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ventas_frontend
    ports:
      - "5173:5173"  # ← Cambiado
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
    command: npm run dev -- --host --port 5173 # ← Este comando es obligatorio para que Vite escuche fuera del contenedor


volumes:
  postgres_data:
